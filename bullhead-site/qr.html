<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<title>Table QR posters | Bullhead</title>
<style>
body{margin:0;font-family:Inter,system-ui,sans-serif;background:#eee;color:#241712}.bar{padding:14px;background:#241712;color:#fff;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.bar input,.bar button{font:inherit;padding:8px 10px;border-radius:8px;border:0}.bar input{width:70px}.bar button{background:#e8332b;color:#fff;font-weight:600;cursor:pointer}
.p{width:148mm;height:210mm;margin:14px auto;background:#fff;text-align:center;box-sizing:border-box;padding:16mm 12mm;display:flex;flex-direction:column;justify-content:space-between;page-break-after:always;border:3px solid #241712}
.p h1{margin:0;font-size:34pt}.p h2{margin:0;font-size:22pt;color:#e8332b}.tn{font-size:90pt;font-weight:800;line-height:1}.q{display:flex;justify-content:center}.p small{font-size:12pt}
@media print{body{background:#fff}.bar{display:none}.p{margin:0;border:0;width:auto;height:100vh}@page{size:A5;margin:0}}
</style></head><body>
<div class="bar"><b>Table QR posters</b><label>Tables 1 to <input id="n" type="number" min="1" max="60" value="10"></label><button id="mk">Make posters</button><button id="pr">Print</button><small>A5, one per page. Save as PDF to send to a printer.</small></div>
<div id="out"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
function make(){var o=document.getElementById('out');o.innerHTML='';var n=+document.getElementById('n').value||1;
for(var i=1;i<=n;i++){var d=document.createElement('div');d.className='p';d.innerHTML='<div><h1>Bullhead</h1><h2>Order from your seat</h2><small>Agiza ukiwa umekaa</small></div><div><small>TABLE · MEZA</small><div class="tn">'+i+'</div></div><div class="q"></div><small>Scan · open the menu · tap send.<br>Skani · fungua menyu · tuma.</small>';
o.appendChild(d);new QRCode(d.querySelector('.q'),{text:location.origin+'/menu?table='+i,width:300,height:300,correctLevel:QRCode.CorrectLevel.M})}}
document.getElementById('mk').onclick=make;document.getElementById('pr').onclick=function(){window.print()};make();
</script></body></html>
